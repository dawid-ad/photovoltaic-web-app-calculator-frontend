<div *ngIf="isVisible" class="cookie-banner">
  <p>
    🍪 Ta strona korzysta z plików cookies, aby zapewnić prawidłowe działanie strony. Korzystając z niej, akceptujesz naszą
    <a routerLink="/polityka-prywatnosci" target="_blank">politykę prywatności</a>.
  </p>
  <button (click)="acceptCookies()" matRipple>Ok</button>
</div>
